# Configuração da automação de posts
# Alterar aqui ajusta o comportamento sem precisar editar os prompts.

cadencia:
  dia: segunda
  hora_local: "08:00"
  timezone: America/Sao_Paulo

volume:
  posts_por_semana: 3
  temas_pesquisados: 7      # pesquisa mais do que vai postar, para dar escolha
  temas_sugeridos: 5        # na entrega semanal, apresenta top 5 para o advogado escolher 3

formatos:
  - carrossel               # máximo 4 slides (capa + 2 desdobramentos + CTA)
  - feed_single

ganchos_permitidos:         # os únicos tipos de abertura aprovados
  - dado_forte              # número, data, prazo em destaque (preferido)
  - pergunta_provocativa    # dúvida que o leitor PF já tem

estrutura_carrossel:
  slides: 4                 # fixo em 4 — não inflar
  sequencia:
    - "slide 1: dado forte ou pergunta provocativa (gancho)"
    - "slide 2: desdobramento (o que significa / por que importa)"
    - "slide 3: aplicação prática (quem se encaixa + o que fazer)"
    - "slide 4: CTA + assinatura"

publicacao:
  modo: manual              # alternativas futuras: buffer, instagram_graph_api
  entrega:
    - sessao_claude
    - email                 # pendente de confirmação do endereço

aprovacoes:
  - etapa: curadoria_semanal
    obrigatoria: true
  - etapa: posts_prontos
    obrigatoria: true

historico:
  manter_por_dias: 180      # evitar repetir temas publicados nos últimos 6 meses
